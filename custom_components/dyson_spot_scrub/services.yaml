clean_room:
  name: Clean Room
  description: >
    Start a single-room clean on the Dyson Spot+Scrub AI robot.
    The robot will clean only the named room, then return to its dock.
  fields:
    room:
      name: Room
      description: >
        The display name of the room to clean, exactly as reported in the
        vacuum entity's "rooms" attribute (e.g. "Living Room", "Kitchen",
        "Dining", "Toilet").  Matching is case-insensitive.
      required: true
      example: Living Room
      selector:
        text:

clean_rooms:
  name: Clean Rooms (Sequential)
  description: >
    Clean multiple rooms one at a time.  The robot finishes each room and
    returns to its dock before moving on to the next.  Rooms are cleaned in
    the order listed.
  fields:
    rooms:
      name: Rooms
      description: >
        List of room names to clean, in order.  Each name must match the
        vacuum entity's "rooms" attribute exactly (case-insensitive), e.g.
        ["Living Room", "Kitchen", "Dining"].
      required: true
      example: '["Living Room", "Kitchen"]'
      selector:
        object:
